services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: worktrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: worktrack
    volumes:
      - db_data:/var/lib/postgresql/data
    # Not exposed to the internet — only reachable by other containers on
    # this compose network. Remove the whole "ports" block in production;
    # kept here commented as a reminder of what NOT to do.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worktrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://worktrack:${POSTGRES_PASSWORD}@db:5432/worktrack
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    # Not published to the host directly — Nginx reaches it over the
    # internal compose network at http://backend:4000.

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  db_data:
